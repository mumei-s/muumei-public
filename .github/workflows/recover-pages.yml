name: Recover and deploy MUUMEI Pages
on:
  push:
    branches: [main]
    paths: ['ops/**', '.github/workflows/recover-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muumei-pages-recovery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SOURCE_REVISION: 4ec57cbb15712cd823470212f5074b889ff0f1ad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This is a one-time recovery from the previously published snapshot.
      # No additional private source or credentials are copied into this repository.
      - uses: actions/checkout@v4
        with:
          ref: 4ec57cbb15712cd823470212f5074b889ff0f1ad
          path: recovered
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - name: Restore and verify missing public media
        run: node ops/recover-assets.mjs recovered
      - name: Install frozen dependencies
        run: |
          pnpm --dir recovered/apps/app install --frozen-lockfile
          pnpm --dir recovered/apps/owner install --frozen-lockfile
      - name: Typecheck and build isolated surfaces
        run: |
          node ops/package-pages.mjs recovered app /muumei-public/ https://mumei-s.github.io/muumei-public/
          node ops/package-pages.mjs recovered owner / https://mumei-s.github.io/muumei-public/
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify mobile, desktop, routes, images, contrast and PWA scope
        run: python ops/check-pages.py recovered/release
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muumei-pages-verification
          path: |
            verification/result.json
            verification/*.png
          if-no-files-found: ignore
      - name: Save OWNER package without publicly hosting its login
        uses: actions/upload-artifact@v4
        with:
          name: muumei-owner-separate-origin-package
          path: recovered/release/owner/
          include-hidden-files: true
      - name: Commit only the verified application release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main changed during verification; refusing to overwrite it'; exit 1; }
          mkdir -p docs
          cp -a recovered/release/app/. docs/
          if find docs -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' -o -name '*.sql' \) | grep -q .; then echo 'Unexpected source or sensitive file in release'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified MUUMEI distribution files only'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: recovered/release/app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Initial Pages enablement is an account administration setting.
      # Do not attempt to bypass it with unrelated repositories or tokens.
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
