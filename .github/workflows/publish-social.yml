name: Publish and verify separated MUUMEI pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/publish-social.yml', '.github/scripts/public-experience-browser.py', '.github/scripts/pwa-browser.py', '.github/scripts/live-auth-browser.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muumei-pages-social-release
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled public pages and disconnected participant sample
        run: |
          python - <<'PY'
          import base64,json,pathlib,re
          root=pathlib.Path('docs')
          def load(path):return json.loads((root/path).read_text())
          public=load('public-site-release.json')
          sample=load('review/release.json')
          receipt=load('release-receipt.json')
          revision=public['sourceRevision']
          assert re.fullmatch(r'[0-9a-f]{40}',revision),'Invalid source revision'
          assert public['mode']=='public-information' and public['base']=='/muumei-public/'
          assert all(public[key] is False for key in ['memberRuntime','ownerRuntime','sampleData','backendConnection'])
          assert sample['sourceRevision']==receipt['sourceRevision']==revision,'Public/sample revision mismatch'
          assert sample['mode']=='synthetic-only' and sample['surface']=='participant'
          assert sample['ownerIncluded'] is False and sample['realOwner'] is False
          assert receipt['mode']=='separated-public-and-participant-sample'
          assert all(receipt[key] is False for key in ['ownerIncluded','realBackendChanged','registrationEnabled'])
          member=load('review/member/build-info.json')
          assert member['sourceRevision']==revision and member['surface']=='app' and member['ready'] is False
          # Real member/Auth, public and sample pages share the reviewed source.
          actual_build=load('build-info.json')
          assert actual_build['sourceRevision']==receipt['memberSourceRevision']==revision
          assert receipt['realMemberRuntime']=='current-compiled'
          assert actual_build['surface']=='app' and actual_build['ready'] is False
          assert actual_build['workIntakeFormEnabled'] is False
          assert actual_build['workGuideOnlyRoutes']==['jobs','direct']
          guide=receipt['workGuide']
          assert guide['mode']=='static-information' and guide['sourceRevision']==revision
          assert all(guide[key] is False for key in ['submissionEnabled','backendConnection','javascript'])
          assert re.fullmatch(r'assets/work-guide-[a-f0-9]{12}\.css',guide['stylePath'])
          import hashlib
          for route in ['jobs','direct']:
            html=(root/route/'index.html').read_text()
            assert hashlib.sha256(html.encode()).hexdigest()==guide['htmlSha256']
            assert not re.search(r'<(?:script|form|input|textarea)\b',html,re.I)
            assert "script-src 'none'" in html and "connect-src 'none'" in html and "form-action 'none'" in html
          assert hashlib.sha256((root/guide['stylePath']).read_bytes()).hexdigest()==guide['cssSha256']
          actual=load('muumei-config.json')
          assert actual['ready'] is False and actual['key']==''
          assert actual['configUrl']=='https://slamzhgsawfnmwlejgqp.supabase.co/functions/v1/public-config'
          disconnected=load('review/member/muumei-config.json')
          assert disconnected['url']==disconnected['key']=='' and disconnected['ready'] is False
          for config in [actual,disconnected]:
            operator=config.get('operator',{})
            assert operator.get('name','') in ['', 'MUUMEI', 'MUUMEI 運営']
            assert operator.get('address','')==operator.get('contact','')==''
          for route in public['routes']:
            assert isinstance(route,str) and '..' not in route and not route.startswith('/')
            page=root/route/'index.html'
            assert page.is_file() and "connect-src 'self';" in page.read_text(),str(page)
          for path in ['login/index.html','join/index.html','receive/index.html','invite/index.html','app/home/index.html','app/messages/index.html','review/member/demo/home/index.html']:
            assert (root/path).is_file(),path
          count=0
          for file in root.rglob('*'):
            name=file.relative_to(root)
            assert not file.is_symlink(),'Symlink in public distribution'
            assert not any(part in ['owner','.git','node_modules','__pycache__'] or part.startswith('.env') for part in name.parts),str(name)
            if not file.is_file():continue
            count+=1
            assert file.suffix.lower() not in ['.ts','.tsx','.sql','.map','.mjs','.cjs','.py','.pyc','.yml','.yaml'],str(name)
            assert 'legacy-private-v3-' not in str(name),'Obsolete member runtime in distribution'
            if file.suffix.lower() not in ['.js','.css','.json','.html','.txt','.svg','.webmanifest']:continue
            content=file.read_text()
            assert not re.search(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]{20,}|-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----',content),str(name)
            for token in re.findall(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',content):
              try:role=json.loads(base64.urlsafe_b64decode(token.split('.')[1]+'===')).get('role')
              except (ValueError,UnicodeError):continue
              assert role!='service_role','Privileged token in public distribution'
            if file.suffix=='.json':assert json.loads(content).get('surface')!='owner',str(name)
            if file.suffix=='.js':
              assert not any(marker in content for marker in ['owner-shell','owner-intake-tabs','確認用管理画面','受付・承認を開く']),str(name)
          print(json.dumps(dict(sourceRevision=revision,files=count,ownerIncluded=False,registrationEnabled=False)))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    name: Verify live (${{ matrix.engine }})
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --ipc=host
    env:
      HOME: /root
      MUUMEI_BROWSER_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Python verifier
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --no-cache-dir --timeout 30 --retries 2 playwright==1.55.0
      - name: Confirm matching public, participant and real member revisions
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json,pathlib,time,urllib.request
          base='https://mumei-s.github.io/muumei-public/'
          root=pathlib.Path('docs')
          paths=['public-site-release.json','release-receipt.json','review/release.json','review/member/build-info.json','build-info.json']
          wanted={path:json.loads((root/path).read_text()) for path in paths}
          revision=wanted['public-site-release.json']['sourceRevision']
          assert wanted['review/release.json']['sourceRevision']==wanted['release-receipt.json']['sourceRevision']==wanted['build-info.json']['sourceRevision']==revision
          for attempt in range(20):
            try:
              actual={}
              for path in paths:
                request=urllib.request.Request(base+path+'?release='+revision,headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(request,timeout=15) as response:
                  assert response.status==200,path
                  actual[path]=json.load(response)
              if actual==wanted:break
            except Exception:pass
            time.sleep(3)
          else:raise SystemExit('Published public/sample/member metadata does not match this deployment')
          print('Published public/sample/member revisions match:',revision)
          PY
      - name: Record live-browser storage headroom
        run: |
          python - <<'PY_STORAGE'
          import json,os,shutil
          for path in ['.', '/tmp']:
              usage=shutil.disk_usage(path);stats=os.statvfs(path)
              print(json.dumps(dict(path=path,total=usage.total,free=usage.free,available_inodes=stats.f_favail)))
              if usage.free < 512*1024*1024:raise SystemExit('Insufficient browser-test storage headroom')
          PY_STORAGE
      - name: Verify public pages and isolated participant sample at nine widths
        if: ${{ !cancelled() }}
        run: python .github/scripts/public-experience-browser.py https://mumei-s.github.io/muumei-public/
      - name: Verify real anonymous configuration and existing member login gate
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: python .github/scripts/live-auth-browser.py https://mumei-s.github.io/muumei-public/
      - name: Verify live install strip, manifest and supported offline recovery
        if: ${{ !cancelled() }}
        run: python .github/scripts/pwa-browser.py https://mumei-s.github.io/muumei-public/
      - name: Record final live-browser storage
        if: always()
        run: |
          python - <<'PY_STORAGE'
          import json,os,shutil
          for path in ['.', '/tmp']:
              usage=shutil.disk_usage(path);stats=os.statvfs(path)
              print(json.dumps(dict(path=path,total=usage.total,free=usage.free,available_inodes=stats.f_favail)))
          PY_STORAGE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: separated-public-live-verification-${{ matrix.engine }}
          path: verification/
