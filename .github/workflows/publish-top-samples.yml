name: Publish MUUMEI top samples
on:
  push:
    branches: [main]
    paths:
      - 'docs/top-samples/**'
      - '.github/workflows/publish-top-samples.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: muumei-pages-top-samples
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview files exist
        run: |
          test -f docs/top-samples/index.html
          test -f docs/top-samples/a/index.html
          test -f docs/top-samples/b/index.html
          test -f docs/top-samples/c/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
