name: Publish verified canonical MUUMEI app
on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Fresh one-use download URL for the app-only package
        required: true
        type: string
      payload_sha256:
        description: Expected package SHA-256
        required: true
        type: string
      source_revision:
        description: Verified canonical source revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: muumei-pages-recovery
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Receive and validate app-only distribution
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, stat, urllib.parse, urllib.request, zipfile
          inputs=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          url=inputs['package_url']; expected=inputs['payload_sha256']; revision=inputs['source_revision']
          # Read the short-lived URL from the event file, never interpolate it into shell or env logs.
          print('::add-mask::'+url,flush=True)
          u=urllib.parse.urlsplit(url)
          for value in urllib.parse.parse_qs(u.query).get('token',[]): print('::add-mask::'+value,flush=True)
          assert re.fullmatch(r'[0-9a-f]{64}',expected) and re.fullmatch(r'[0-9a-f]{40}',revision)
          assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com' and not u.username and not u.password
          assert re.fullmatch(r'/mumei-s/muumei/pages-transfer-[0-9a-f]{40}-[0-9]+/package\.json',u.path)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs): return None
          try:
            with urllib.request.build_opener(NoRedirect).open(url,timeout=60) as response:
              raw=response.read(30*1024*1024+1)
          except Exception:
            raise SystemExit('Package download failed; obtain a fresh download URL and retry.')
          assert len(raw)<=30*1024*1024 and hashlib.sha256(raw).hexdigest()==expected
          envelope=json.loads(raw)
          assert envelope['format']=='muumei-public-dist-v1' and envelope['source_revision']==revision
          archive_data=base64.b64decode(envelope['payload'],validate=True)
          assert hashlib.sha256(archive_data).hexdigest()==envelope['archive_sha256']
          root=pathlib.Path('distribution'); root.mkdir()
          allowed={'.html','.js','.css','.json','.webmanifest','.svg','.png','.webp','.jpg','.jpeg','.ico','.txt','.woff','.woff2'}
          with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
            entries=archive.infolist(); assert len(entries)<3000 and sum(x.file_size for x in entries)<100*1024*1024
            seen=set()
            for entry in entries:
              p=pathlib.PurePosixPath(entry.filename)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and p.parts
              assert entry.filename not in seen; seen.add(entry.filename)
              assert not stat.S_ISLNK(entry.external_attr>>16)
              assert not any(part in {'owner','.git','node_modules'} for part in p.parts)
              assert p.suffix in allowed or str(p)=='.nojekyll'
              target=root.joinpath(*p.parts); target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(archive.read(entry))
          info=json.loads((root/'build-info.json').read_text())
          assert info['surface']=='app' and info['sourceRevision']==revision and info['base']=='/muumei-public/' and info['ready'] is False
          assert (root/'jobs/index.html').exists() and (root/'direct/index.html').exists()
          print('Validated public application package from '+revision)
          PY
      - name: Commit distribution only, preserving existing source privacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Public main changed; refusing to overwrite'; exit 1; }
          mkdir -p docs
          cp -a distribution/. docs/
          if find docs -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.map' -o -name '.env*' -o -name '*.sql' \) | grep -q .; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified community-first application distribution'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser verifier
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify the published community and both job entrances
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from playwright.sync_api import sync_playwright, expect
          base='https://mumei-s.github.io/muumei-public/'
          revision=os.environ['SOURCE_REVISION']; out=pathlib.Path('verification'); out.mkdir()
          for attempt in range(30):
            try:
              info=json.load(urllib.request.urlopen(base+'build-info.json?v='+revision,timeout=20))
              if info.get('sourceRevision')==revision: break
            except Exception: pass
            time.sleep(3)
          else: raise SystemExit('Published revision not visible yet')
          results=[]
          def record(name,ok,**details):
            results.append({'name':name,'ok':bool(ok),**details})
            (out/'result.json').write_text(json.dumps({'source_revision':revision,'real_services_tested':False,'checks':results},ensure_ascii=False,indent=2))
            print(json.dumps(results[-1],ensure_ascii=False),flush=True)
          with sync_playwright() as p:
            browser=p.chromium.launch()
            for width in [360,390,1280]:
              context=browser.new_context(viewport={'width':width,'height':900},device_scale_factor=3 if width<500 else 1,reduced_motion='reduce')
              context.route('https://*.supabase.co/**',lambda route:route.abort())
              page=context.new_page(); errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              try:
                for route,marker in [('', 'community-landing'),('jobs?source=direct','shared-jobs'),('direct','shared-jobs'),('demo/home','community-home')]:
                  response=page.goto(base+route+('&' if '?' in route else '?')+'v='+revision,wait_until='networkidle')
                  expect(page.locator('[data-page="'+marker+'"]').first).to_be_visible(timeout=20000)
                  overflow=page.evaluate('document.documentElement.scrollWidth-innerWidth')
                  record(f'{width}:{route}:layout',response.status==200 and overflow<=2,overflow=overflow)
                  if marker=='community-landing':
                    text=page.inner_text('#main')
                    record(f'{width}:top-community-only',not any(x in text for x in ['求人見本','報酬','求人ごと']) and page.locator('.job-card,.m-work-sample').count()==0)
                    if width==390: page.screenshot(path=str(out/'community-top-390-dpr3.png'),full_page=False)
                    page.locator('[data-entry="community-jobs"]').click()
                    expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                    record(f'{width}:top-button-to-jobs','/jobs' in page.url)
                  elif marker=='shared-jobs':
                    expect(page.locator('[data-action="job-sample"]')).to_be_visible()
                    record(f'{width}:{route}:sample-visible-without-community',True)
                    if width==390 and route.startswith('jobs'): page.screenshot(path=str(out/'shared-jobs-390-dpr3.png'),full_page=True)
                  else:
                    record(f'{width}:home-no-job-feed',page.locator('.job-card').count()==0 and '届いている仕事' not in page.inner_text('#main'))
                    page.locator('[data-entry="community-jobs"]').click()
                    expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                    record(f'{width}:community-home-to-shared-jobs',True)
                page.goto(base+'jobs?source=direct&v='+revision,wait_until='networkidle')
                page.locator('[data-action="job-sample"]').click()
                expect(page.locator('a.job-card').first).to_be_visible(timeout=20000)
                expect(page.locator('.demo-banner')).to_contain_text('求人見本')
                record(f'{width}:direct-sample-open','/demo/work' in page.url)
                page.get_by_role('link',name='求人ページに戻る').click()
                expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                page.reload(wait_until='networkidle')
                expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                record(f'{width}:sample-return-reload',True)
              except Exception as error:
                record(f'{width}:flow',False,error=str(error),url=page.url)
                page.screenshot(path=str(out/f'failure-{width}.png'),full_page=True)
              record(f'{width}:no-js-errors',not errors,errors=errors)
              context.close()
            browser.close()
          assert results and all(x['ok'] for x in results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muumei-community-live-verification
          path: verification/
          if-no-files-found: ignore
