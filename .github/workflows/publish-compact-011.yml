name: Publish verified compact community and review 0.11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-compact-011.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muumei-pages-recovery
  cancel-in-progress: false
env:
  SOURCE_REVISION: 13cc078a95c94773fb03008e98631bb0c28df4a4
  DISTRIBUTION_SHA256: 9546d10b62052370d15765b16df06d53fad273ef391a3cfb9f8abaa72e80ba3c
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Pin the current public branch before changing files
        run: echo EXPECTED_PUBLIC_HEAD=$(git rev-parse HEAD) >> "$GITHUB_ENV"
      - name: Verify checksum and safety of the compiled-only public artifact
        env:
          PUBLIC_DISTRIBUTION_URL: 'https://productionresultssa18.blob.core.windows.net/actions-results/c1339297-d935-4921-abc9-98d82a67b93e/workflow-job-run-7485370a-38de-509e-b979-280fe4827d6e/artifacts/aec3039d0048eebfb8222101656f377f75e075a9c273dd5d32c078b6efb7069f.zip?rscd=attachment%3B+filename%3D%22compact-ui-public-distribution.zip%22&rsct=application%2Fzip&se=2026-09-29T15%3A18%3A28Z&sig=TSUCQRnQZNvss9c36JS6ToomCCFqR7PWj9Lmo8TBp%2FI%3D&ske=2026-09-29T16%3A54%3A21Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-29T12%3A54%3A21Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-29T15%3A08%3A23Z&sv=2025-11-05'
        run: python .github/scripts/promote-compact.py
      - name: Store verified distribution without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh auth setup-git
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_PUBLIC_HEAD" || { echo 'Public main changed; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github/releases/compact-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified compact community, deletable comments and isolated review 13cc078'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser verifier
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify actual deployed pages with browser-local synthetic data only
        run: python .github/scripts/verify-compact-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-011-live-verification
          path: verification/
          retention-days: 7
