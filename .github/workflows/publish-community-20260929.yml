name: Publish community-first MUUMEI release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-community-20260929.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muumei-pages-recovery
  cancel-in-progress: false
env:
  SOURCE_REVISION: 60114cf5a34c5af29d05aa4f0b220e497de6159c
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and validate the already verified public app only
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib
          revision=os.environ['SOURCE_REVISION']; root=pathlib.Path('docs')
          packed=base64.b64decode(''.join(pathlib.Path(f'.github/releases/community-60114cf.part{i}').read_text().strip() for i in range(1,5)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='1163aef1ce94c1b3e0ee9cdb9976534b1d2458659b58100fd59261d473ddc93e'
          data=lzma.decompress(packed); n=int.from_bytes(data[:4],'big'); h=json.loads(data[4:4+n]); offset=4+n
          assert h['format']=='muumei-verified-dist-delta-v1' and h['sourceRevision']==revision
          assert h['archive_sha256']=='08dd55e05f532ad63fbd492dca707e9796705e7993c701bfc98515ddd7f8d0d8'
          allowed={'.html','.js','.css','.json','.webmanifest','.svg','.png','.webp','.jpg','.jpeg','.ico','.txt','.woff','.woff2'}
          def safe(name):
              p=pathlib.PurePosixPath(name)
              assert name and not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert not any(x in {'owner','.git','node_modules'} or x.startswith('.env') for x in p.parts)
              assert p.suffix in allowed or str(p)=='.nojekyll'
              return p
          if all((root/safe(f['path'])).is_file() and hashlib.sha256((root/safe(f['path'])).read_bytes()).hexdigest()==f['sha256'] for f in h['files']):
              print('All verified distribution files already match.'); raise SystemExit(0)
          seen=set(); reconstructed={}
          for f in h['files']:
              p=safe(f['path']); assert str(p) not in seen; seen.add(str(p))
              a=(root/safe(f['base'])).read_bytes() if f['base'] else b''
              assert hashlib.sha256(a).hexdigest()==f['base_sha256'],f['base']
              program=data[offset:offset+f['program_length']]; offset+=f['program_length']; i=0; cursor=0; b=bytearray()
              def varint():
                  global i
                  value=0; shift=0
                  while True:
                      assert i<len(program) and shift<64
                      c=program[i]; i+=1; value|=(c&127)<<shift
                      if c<128: return value
                      shift+=7
              while i<len(program):
                  tag=varint(); size=tag//2
                  if tag%2:
                      zz=varint(); pos=cursor+(zz//2 if zz%2==0 else -(zz//2)-1)
                      assert 0<=pos<=len(a) and pos+size<=len(a)
                      b.extend(a[pos:pos+size]); cursor=pos+size
                  else:
                      assert i+size<=len(program)
                      b.extend(program[i:i+size]); i+=size
                  assert len(b)<=f['size']
              assert len(b)==f['size'] and hashlib.sha256(b).hexdigest()==f['sha256'],f['path']
              reconstructed[str(p)]=bytes(b)
          assert offset==len(data) and len(reconstructed)==70
          info=json.loads(reconstructed['build-info.json'])
          assert info['surface']=='app' and info['sourceRevision']==revision and info['base']=='/muumei-public/' and info['ready'] is False
          assert {'jobs/index.html','direct/index.html','demo/work/index.html','demo/home/index.html'}<=seen
          # Preserve every old base until all new files have passed their canonical checksums.
          for name,b in reconstructed.items():
              target=root/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(b)
          print('All 70 files match the verified canonical build '+revision)
          PY
      - name: Preserve the verified distribution on public main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main changed; refusing to overwrite'; exit 1; }
          if find docs -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' -o -name '*.sql' \) | grep -q .; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified community-first app; shared job page contains job samples'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser verifier
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify actual public URLs without changing live user data
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from playwright.sync_api import sync_playwright, expect
          base='https://mumei-s.github.io/muumei-public/'
          revision=os.environ['SOURCE_REVISION']; out=pathlib.Path('verification'); out.mkdir()
          for attempt in range(30):
              try:
                  info=json.load(urllib.request.urlopen(base+'build-info.json?v='+revision,timeout=20))
                  if info.get('sourceRevision')==revision: break
              except Exception: pass
              time.sleep(3)
          else: raise SystemExit('The new published revision is not visible yet')
          results=[]
          def record(name,ok,**details):
              results.append({'name':name,'ok':bool(ok),**details})
              (out/'result.json').write_text(json.dumps({'source_revision':revision,'real_services_tested':False,'checks':results},ensure_ascii=False,indent=2))
              print(json.dumps(results[-1],ensure_ascii=False),flush=True)
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [320,390,1280]:
                  context=browser.new_context(viewport={'width':width,'height':900},device_scale_factor=3 if width<500 else 1,reduced_motion='reduce')
                  context.route('https://*.supabase.co/**',lambda route:route.abort())
                  page=context.new_page(); errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  try:
                      for route,marker in [('', 'community-landing'),('jobs?source=direct','shared-jobs'),('direct','shared-jobs'),('demo/home','community-home')]:
                          response=page.goto(base+route+('&' if '?' in route else '?')+'v='+revision,wait_until='networkidle')
                          expect(page.locator('[data-page="'+marker+'"]').first).to_be_visible(timeout=20000)
                          overflow=page.evaluate('document.documentElement.scrollWidth-innerWidth')
                          record(f'{width}:{route}:layout',response.status==200 and overflow<=2,overflow=overflow)
                          if marker=='community-landing':
                              text=page.inner_text('#main')
                              record(f'{width}:top-community-only',not any(x in text for x in ['求人見本','報酬','求人ごと']) and page.locator('.job-card,.m-work-sample').count()==0)
                              image=page.locator('.m-hero-photo img')
                              image_info=image.evaluate('(e)=>({width:e.naturalWidth,height:e.naturalHeight,renderedWidth:e.getBoundingClientRect().width,renderedHeight:e.getBoundingClientRect().height})')
                              record(f'{width}:full-resolution-photo',image_info['width']>=1536 and image_info['height']>=1024,**image_info)
                              if width==390: page.screenshot(path=str(out/'community-top-390-dpr3.png'),full_page=False)
                              page.locator('[data-entry="community-jobs"]').click()
                              expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                              record(f'{width}:top-button-to-shared-jobs','/jobs' in page.url)
                          elif marker=='shared-jobs':
                              expect(page.locator('[data-action="job-sample"]')).to_be_visible()
                              record(f'{width}:{route}:sample-without-community',True)
                              if width==390 and route.startswith('jobs'): page.screenshot(path=str(out/'shared-jobs-390-dpr3.png'),full_page=True)
                          else:
                              record(f'{width}:home-no-job-feed',page.locator('.job-card').count()==0 and '届いている仕事' not in page.inner_text('#main'))
                              page.locator('[data-entry="community-jobs"]').click()
                              expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                              record(f'{width}:community-home-to-shared-jobs',True)
                      page.goto(base+'jobs?source=direct&v='+revision,wait_until='networkidle')
                      page.locator('[data-action="job-sample"]').click()
                      expect(page.locator('a.job-card').first).to_be_visible(timeout=20000)
                      expect(page.locator('.demo-banner')).to_contain_text('求人見本')
                      record(f'{width}:direct-sample-open','/demo/work' in page.url)
                      page.get_by_role('link',name='求人ページに戻る').click()
                      expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                      page.reload(wait_until='networkidle')
                      expect(page.locator('[data-page="shared-jobs"]')).to_be_visible()
                      record(f'{width}:sample-return-and-reload',True)
                  except Exception as error:
                      record(f'{width}:flow',False,error=str(error),url=page.url)
                      page.screenshot(path=str(out/f'failure-{width}.png'),full_page=True)
                  record(f'{width}:no-js-errors',not errors,errors=errors)
                  context.close()
              browser.close()
          assert results and all(x['ok'] for x in results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muumei-community-live-verification
          path: verification/
          if-no-files-found: ignore
